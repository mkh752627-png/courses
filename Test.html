<!DOCTYPE html> <title>Abu-Hanin</title>
<div style="max-width:400px; margin:20px auto; position:relative;">
  <input 
    type="text" 
    id="searchBox"
    placeholder="ابحث هنا..."
    style="width:100%; padding:12px 45px 12px 15px; border-radius:25px; border:1px solid #333; background:#1e1e1e; color:white; outline:none;"
  >
  <span style="position:absolute; right:15px; top:12px;">🔍</span>
</div>

<script>
  document.getElementById('searchBox').addEventListener('input', function(e){
    let value = e.target.value.toLowerCase()
    // هنا تحط كود البحث حقك
    console.log("تبحث عن:", value)
  })
</script>
<!-- حط هذا في المكان اللي تبغى يظهر فيه التاريخ -->
<div id="datetime" style="background:#1e1e1e; color:#fff0; padding:10px 15px; border-radius:8px; text-align:center; font-weight:bold; margin:15px 0;"></div>

<script>
function updateDateTime(){
  let now = new Date()
  let date = now.toLocaleDateString('ar-YE', {weekday:'long', year:'numeric', month:'long', day:'numeric'})
  let time = now.toLocaleTimeString('ar-YE')
  document.getElementById('datetime').innerHTML = "📅 " + date + " | ⏰ " + time
}
setInterval(updateDateTime, 1000)
updateDateTime()
</script>
