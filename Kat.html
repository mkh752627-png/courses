               <aside id="sidebar">
        <!-- 1. حولنا العنوان إلى زر -->
        <button onclick="toggleList()">القائمة ▼</button>

        <!-- 2. أعطينا القائمة id حتى نتحكم في إظهارها وإخفائها -->
        <ul id="menu-list" style="display: none;">
            <li><a href="#">الرئيسية</a></li>
            <li><a href="#">الطلبات</a></li>
            <li><a href="#">الإعدادات</a></li>
        </ul>
    </aside>
    <script>
        function toggleList() {
            var list = document.getElementById("menu-list");
            if (list.style.display === "none") {
                list.style.display = "block"; // إظهار
            } else {
                list.style.display = "none";  // إخفاء
            }
        }
    </script>
