<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>عنوان الصفحة</title>
    <style>
        /* هنا تضع تصميم وتنسيق الأصفحة (CSS) */
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
        }
    </style>
</head>
<body>

    <!-- رأس الصفحة أو العنوان الرئيسي -->
    <header>
        <h1>مرحباً بك في موقعي</h1>
    </header>

    <!-- محتوى الصفحة الأساسي -->
    <main>
        <p>هذا هو المحتوى الذي يظهر للمستخدم داخل الصفحة.</p>
        
        <!-- مثال على نموذج (Form) -->
        <form action="#" method="POST">
            <label for="username">اسم المستخدم:</label>
            <input type="text" id="username" name="username">
            <button type="submit">إرسال</button>
        </form>
    </main>

    <!-- أسفل الصفحة (Footer) -->
    <footer>
        <p>جميع الحقوق محفوظة &copy; 2026</p>
    </footer>

    <script>
        // هنا تضع أكواد الجافاسكريبت (JavaScript) للتفاعل
        console.log("الصفحة تعمل بنجاح!");
    </script>
    <footer>Abu-Hanin</footer><style=aril>
</body>
</html>
